<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Dosis">
    <!-- Mi CSS -->
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="src/css/admin.css">
    <link rel="stylesheet" href="src/css/components.css">
    <link rel="stylesheet" href="src/css/modals.css">
    <!-- Toastify -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- importa los iconos desde google icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" href="src/img/favicon.ico" type="image/x-icon">
    <meta name="description" content="Aplicación para planificar semanas de entrenamiento en el gimnasio.">
    <title>Home Administrador</title>
</head>
<body>
   
        <!-- Barra de navegación -->
     <section class="navbar-container">
        <nav class="navbar">
            <ul>
              <li><a href="home-principal.html"><span class="material-symbols-outlined">home</span>Home</a></li>
              <li><a href="perfil.html"><span class="material-symbols-outlined">person</span>Perfil</a></li>
              <li id="admin"></li>
              <li><a href="#"><span class="material-symbols-outlined">docs</span>Informe</a></li>
              <li><a href="#" id="salir-icon" ><span class="material-symbols-outlined">output_circle</span>Salir</a></li>
            </ul>
        </nav>
    </section>

<!-- --------------Banner----------- -->
    <div class="banner">
        <!-- Logo -->
        <div class="logo-izq">
            <img src="src/img/logo01.png" alt="Gym App Logo" class="logo top">
        </div>

        <!-- Permite mostrar el nombre de usuario  -->
        <h2 id="nombre-admin">Cargando Nombre...</h2>
        <span class="material-symbols-outlined">shield_person 
            <p id="email-admin"></p>
        </span>
        
    </div>
<!-- -----------------------Botones Admin---------------- -->
    <div class="cont-botones">
        
    <!-- AGREGAR ENTRENAMIENTOS, SOLO ROL ADMIN -->
    <a id="btn-exercises" class="training-btn" href="#" ><span class="material-symbols-outlined icon-circle">add_circle</span>Agregar Nuevos Ejercicios</a>
    <section id="cont-exercises" class="cont-entrenos">
    <form id="entrenamiento-form">
        <div class="container-enf-musc">
            <div class="cont-enfoque">
                <label for="enfoque">Escoge un enfoque</label>
                <select name="enfoque" id="enfoque">
                    <option></option>
                    <option value="tren-superior">Tren Superior</option>
                    <option value="tren-inferior">Tren Inferior</option>
                </select>
            </div>
            
    
           <div id="cont-superior" class="hidden">
                <label for="musculos-superior">Músculo</label>
                <select name="musculos-superior" id="musculos-superior">
                    <option value=""></option>
                    <option value="pecho">Pecho</option>
                    <option value="espalda">Espalda</option>
                    <option value="biceps">Biceps</option>
                    <option value="triceps">Triceps</option>
                    <option value="hombro">Hombro</option>
                </select>
           </div> 

           <div id="cont-inferior" class="hidden">
                <label for="musculos-inferior">Músculo</label>
                <select name="musculos-inferior" id="musculos-inferior">
                    <option value=""></option>
                    <option value="cuadriceps">Cuadriceps</option>
                    <option value="gluteos">Gluteos</option>
                    <option value="femoral">Femoral</option>
                    <option value="abductores">Abductores</option>
                    <option value="pabtorrillas">Pantorrillas</option>
                </select>
            </div> 
        </div>
     
        <div id="cont-ejercicios">
            <div id="cont-inputs-icons">
                <!-- Aqui se insertan los inputs -->
            </div>
            <div id="cont-addBtn" class="hidden">
                <span id="addBtn" class="material-symbols-outlined"> <p>Add Exercise</p> add_circle</span>
            </div>
        </div>
       
        
    </form>
    </section>

    <!-- VISUALIZAR ENTRENAMIENTOS, SOLO ROL ADMIN -->
    <a id="btn-visualizar" class="training-btn" href="#" ><span class="material-symbols-outlined icon-circle">visibility</span>Visualizar Ejercicios</a>
    <section id="cont-visualizar" class="cont-entrenos">
        <div id="visualizar-trainer">
            <div id="cont-trenSuperior">
                <!-- Aqui se visualizan los ejercicios desde la BD -->
            </div>
            
            <div id="cont-trenInferior">
                <!-- Aqui se visualizan los ejercicios desde la BD -->
            </div>
        </div>
    </section>

    <!-- ARMAR ENTRENAMIENTOS, SOLO ROL ADMIN -->
    <a id="btn-training" class="training-btn" href="#"><span class="material-symbols-outlined">construction</span>Armar Entrenamientos</a>
    <section id="cont-training" class="cont-entrenos">
            <form id="entrenamientos-form">

                <div class="cont-nivel-frec">
                    <div class="niveles">
                    <label for="nivel">Nivel: </label>
                    <select name="nivel" id="niveles">
                        <option value=""></option>
                        <option value="basico">Básico</option>
                        <option value="intermedio">Intermedio</option>
                        <option value="avanzado">Avanzado</option>
                    </select>
                    </div>

                    <div class="frecuencia">
                    <label for="frecuencia">Frecuencia de entrenamiento: </label>
                    <select name="frecuencia" id="frecuencia">
                        <option value=""></option>
                        <option value="tres-dias">3 Días</option>
                        <option value="cuatro-dias">4 Días</option>
                        <option value="cinco-dias">5 Días</option>
                        <option value="seis-dias">6 Días</option>
                    </select>                        
                    </div>
                </div>

                <div class="cont-gen-enf">
                    <div class="genero">
                    <label for="genero">Genero: </label>
                    <select name="genero" id="genero">
                        <option value=""></option>
                        <option value="mujere">Mujer</option>
                        <option value="hombre">Hombre</option>
                    </select>
                    </div>

                    <div class="enfoque">
                    <label for="enfoque">Enfoque: </label>
                    <select name="enfoque" id="enfoque2">
                        <option value=""></option>
                        <option value="tren-superior">Tren Superior</option>
                        <option value="tren-inferior">Tren Inferior</option>
                    </select>
                    </div>
                </div>
                
                <label for="objetivos">Objetivo de entrenamiento</label>
                <select name="objetivos" id="objetivo">
                    <option value=""></option>
                    <option value="recomposicion">Recomposición corporal </option>
                    <option value="tren-superior">Aumento de masa muscular  Tren Superior</option>
                    <option value="tren-inferior">Aumento de masa muscular  Tren Inferior</option>
                </select>

                
                
                <div class="cont-sem-dia">
                    <div class="semanas">
                        <label for="semanas">Semana</label>
                        <input name="semanas" id="numero-semanas" type="number" max="16">
                    </div>
                    
                    <div class="dias">
                        <label for="dias">Día de entrenamiento</label>
                        <select name="dias" id="dias">
                            <option value=""></option>
                            <option value="lunes">Lunes</option>
                            <option value="martes">Martes</option>
                            <option value="miercoles">Míercoles</option>
                            <option value="jueves">Jueves</option>
                            <option value="viernes">Viernes</option>
                            <option value="sabado">Sábado</option>
                        </select>
                    </div>
                    
                </div>
                

                <label for="ejercicios">Ejercicios: </label>
                <input type="text" placeholder=" Buscar">
                <select name="ejerciicos" id="ejercicios">
                    <option value=""></option>
                    <option value="">Aqui van los ejercicios</option>
                </select>
            </form>
    </section>

    </div>

    <!-- ---------------------------Modal de confirmación----------------- -->
     <div id="modal-confirm" class="cont-modal">
        <div class="contenido-modal">
            <h2 id="mensaje-modal">¿Estás seguro?</h2>
            <div class="botones-modal">
                <button id="cancelar-btn">Cancelar</button>
                <button id="aceptar-btn">Aceptar</button>
            </div>
        </div>
     </div>

     
    


    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="src/js/admin.js" type="module"></script>
</body>
</html>
