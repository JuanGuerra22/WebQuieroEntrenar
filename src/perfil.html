<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Dosis">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=edit" />
    <meta name="description" content="Aplicación para planificar semanas de entrenamiento en el gimnasio.">
    <link rel="stylesheet" href="css/perfil.css">
    <title>Perfil</title>
</head>
<body>
      <!-- Barra de navegación -->
    <section class="navbar-container">
      <nav class="navbar">
          <ul>
            <li><a href="home-principal.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="perfil.html"><i class="fas fa-user"></i> Perfil</a></li>
            <li><a href="informe.html"><i class="fas fa-file"></i> Informe</a></li>
          </ul>
      </nav>
    </section>

   
    <section class="cont-superior">
     
      <div class="logo-izq">
        <img src="img/logo01.png" alt="Gym App Logo" class="logo top">
      </div>

      <div class="perfil">
        <div class="foto-perfil">
          <img src="img/perfil.jpg" alt="Foto de perfil">
        </div>

        <div class="perfil-info">
          <h2 id="nombre">Cargando...</h2>  <!-- Nombre del usuario -->
          <span id="email">Cargando...</span>
        </div> 
      </div>

    </section>

    <section class="cont-informacion">
      <h2>Tu información</h2> 

      <div class="datos">
        
        <h2>Datos personales <span class="material-symbols-outlined">edit</span> </h2> 

        <p>Nombre: <span id="nombre">Cargando...</span></p>
        <p>Email: <span id="peso">Cargando...</span></p>
        <p>Edad: <span id="edad">Cargando...</span></p>
        <p>Peso: <span id="peso">Cargando...</span></p>
        <p>Altura: <span id="altura">Cargando...</span></p>
      
        <h2>Información de entrenamiento</h2>
        <p>Nivel: Avanzado</p>
        <p>Frecuencia: 6 veces por semana</p>
      </div>
      
    </section>



    <script src="js/perfil.js" type="module"> </script>
</body>
</html>
