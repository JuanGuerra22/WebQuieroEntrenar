<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Dosis">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <!-- mi CSS -->
   <link rel="stylesheet" href="css/styles.css">
  <title>Login - Quiero Entrenar</title>
</head>
<body>
    <div class="registro-login-container">
      <img src="img/logo01.png" alt="Gym app Logo" class="logo">
      <h1>Iniciar Sesión</h1> <br>
      <form id="loginForm" class="reg-log-form">
        <input type="email" id="login-email" placeholder="Ingresa tu Email" name="email" required>
        <input type="password" id="login-password" placeholder="Ingresa tu Contraseña" name="password" required>
        <button type="submit">Iniciar Sesión</button>
        <div id="spinner-container" class="spinner-container hidden">
          <div class="spinner"></div>
        </div>
        
      </form>
      <br><p>¿No estas registrado? <a href="registro.html"> Solicita tu registro</a></p>
    </div>

    
    <!-- Toastify -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/login-form.js" type="module"></script>
</body>
</html>
