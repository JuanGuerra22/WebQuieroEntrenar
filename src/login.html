<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Dosis">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <title>Login - Quiero Entrenar</title>
  <!-- mi CSS -->
  <link rel="stylesheet" href="css/styles.css">


</head>
<body>
  <div class="registro-login-container">
    <img src="img/logo01.png" alt="Gym App Logo" class="logo">
    <h1>Iniciar sesión</h1>
    
    <form class="reg-log-form" id="login-form">
      <input type="email" id="login-email" name="email" placeholder="Ingresa tu correo electrónico" required>
      <input type="password" id="login-password" name="password" placeholder="Ingresa tu contraseña" required>
      <a href="#">Olvidé mi contraseña</a>
      
      <button type="submit">Entrar</button>
      <button type="button" onclick="irRegistro()">Registarme</button>
    </form>
    
  </div>

  <script src="js/script.js"></script>
</body>
</html>
