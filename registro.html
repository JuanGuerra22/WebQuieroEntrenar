<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Dosis">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <title>Login - Quiero Entrenar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-container">
    <img src="img/logo01.png" alt="Gym App Logo" class="logo">
    <h1>Solicitar Registro</h1>
    
    <form class="login-form" id="loginForm">
        <input type="text" id="name" name="name" placeholder="Nombre Completo" required>
        <input type="text" id="pais" name="pais" placeholder="Pais de nacimiento" required>
        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" min="1900-01-01" max="2007-12-31">
        <label for="genero">Género:</label>
        <select name="genero" id="genero" required>
            <option value=""></option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
        </select>
        <input type="email" id="email" name="email" placeholder="Ingresa tu Email" required>
        <input type="email" id="email" name="email" placeholder="Confirma tu Email" required>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
      
      <button type="button" onclick="irHomePrincipal()">Solicitar Registro</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
